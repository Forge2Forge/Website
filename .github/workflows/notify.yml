# Sends Forge2Forge push notifications (see notify/notify.py).
# Runs every hour to look for a new episode, and right away when index.html changes (new resources).
# To send a test: Actions tab > Notifications > Run workflow > pick "test".
name: Notifications

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: [index.html]
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = look for new episodes/resources now, test = send a test notification, status = show subscriber and delivery counts'
        type: choice
        options: [check, test, status]
        default: check

permissions:
  contents: write

concurrency:
  group: notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send notifications
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python notify/notify.py --test
          elif [ "${{ github.event.inputs.mode }}" = "status" ]; then
            python notify/notify.py --status
          else
            python notify/notify.py
          fi
      - name: Save what was announced
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notify/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update notification log [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
